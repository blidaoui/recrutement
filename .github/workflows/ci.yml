name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: recruitment_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Prisma Migrate
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitment_db?schema=public

      - name: Run Backend Tests
        run: |
          cd backend
          npm test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitment_db?schema=public

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Run Playwright Tests
        run: |
          npm install -g playwright
          npx playwright install --with-deps
          # Assuming playwright tests are defined in the project, if not, this will fail.
          # We'll try to run them from the root or frontend.
          npx playwright test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitment_db?schema=public

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30

      - name: Coverage Report
        run: |
          # This part assumes vitest coverage is configured
          cd backend
          npx vitest run --coverage
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitment_db?schema=public
